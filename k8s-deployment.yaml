apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-webapp
  labels:
    app: todo-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-webapp
      - name: todo-webapp
        image: registry.digitalocean.com/xask00/todo-webapp:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5 